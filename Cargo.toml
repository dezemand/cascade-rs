[workspace]
resolver = "3"
members = ["crates/*"]
# cascade-gui and ecusim-gui pull in GPUI (~520 crates); build them with -p
default-members = ["crates/cascade-core", "crates/cascade-iface", "crates/cascade-cli", "crates/cascade-diag", "crates/cascade-runner", "crates/ecu8051", "crates/ecuc167", "crates/cascade-j2534", "crates/cascade-can", "crates/ecusim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
authors = ["Maarten"]
description = "Rust port of CASCADE by Ulrich Hecht (CASCADE Public License 1.0)"
publish = false
repository = "https://github.com/dezemand/cascade-rs"

[workspace.dependencies]
cascade-core = { path = "crates/cascade-core" }
cascade-iface = { path = "crates/cascade-iface" }
cascade-diag = { path = "crates/cascade-diag" }
cascade-runner = { path = "crates/cascade-runner" }
clap = { version = "4.6", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
