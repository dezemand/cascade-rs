[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
authors = ["Maarten"]
description = "Rust port of CASCADE by Ulrich Hecht (CASCADE Public License 1.0)"
publish = false

[workspace.dependencies]
cascade-core = { path = "crates/cascade-core" }
cascade-iface = { path = "crates/cascade-iface" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
