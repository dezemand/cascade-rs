[package]
name = "cascade-diag"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
description = "Native KWP2000 K-line diagnostics and logging, using protocol data learned with cascade-rs"
publish.workspace = true
repository.workspace = true

[[bin]]
name = "kdiag"
path = "src/bin/kdiag/main.rs"

[dependencies]
clap.workspace = true
cascade-iface.workspace = true
ecuc167 = { path = "../ecuc167" }
cascade-j2534 = { path = "../cascade-j2534" }
cascade-can = { path = "../cascade-can" }
serialport = { version = "4.10.1", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
ecusim = { path = "../ecusim" }

[lints]
workspace = true

[features]
default = ["serial"]
serial = ["dep:serialport"]

[dev-dependencies]
cascade-core.workspace = true
cascade-runner.workspace = true
